<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function buscarCep() {
            let cep = document.getElementById("cep").value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById("logradouro").value = data.logradouro;
                            document.getElementById("bairro").value = data.bairro;
                            document.getElementById("localidade").value = data.localidade;
                            document.getElementById("uf").value = data.uf;
                        } else {
                            alert("CEP não encontrado!");
                        }
                    })
                    .catch(error => console.error("Erro ao buscar CEP:", error));
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            let form = document.querySelector("form");
            form.addEventListener("submit", function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add("was-validated");
            }, false);
        });

        document.addEventListener("DOMContentLoaded", function() {
            let tipoSelect = document.getElementById("tipo");
            let documentoInput = document.getElementById("documento");
            let labelDocumento = document.getElementById("labelDocumento");

            tipoSelect.addEventListener("change", function () {
                if (tipoSelect.value === "FISICA") {
                    labelDocumento.innerText = "CPF:";
                    documentoInput.placeholder = "999.999.999-99";
                } else {
                    labelDocumento.innerText = "CNPJ:";
                    documentoInput.placeholder = "99.999.999/9999-99";
                }
            });
        });
    </script>
</head>
<body class="container mt-4">
    <h1 class="text-center">Cadastro de Usuário</h1>
    <form th:action="@{/usuarios/salvar}" th:object="${usuarioComEnderecoDTO}" method="post" class="needs-validation" novalidate>

        <!-- 🔹 Nome com validação Bootstrap -->
        <input type="text" th:field="*{usuario.nome}" class="form-control" id="nome" required 
       pattern=".{30,}" 
       title="O nome deve ter pelo menos 30 caracteres."/>
<div class="invalid-feedback">O nome deve ter pelo menos 30 caracteres.</div>

        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" th:field="*{usuario.nomeUsuario}" class="form-control" id="username" required />
        </div>

        <div class="mb-3">
            <label for="foto" class="form-label">Foto:</label>
            <input type="file" accept="image/*" class="form-control"/>
        </div>

        <div class="mb-3">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" th:field="*{usuario.senha}" class="form-control" required 
                   pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}$" 
                   title="A senha deve conter pelo menos 8 caracteres, uma letra maiúscula, uma letra minúscula e um número."/>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" th:field="*{usuario.email}" class="form-control" required 
                   pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" 
                   title="O e-mail deve estar em um formato válido (ex: usuario@empresa.com)"/>
        </div>

        <div class="mb-3">
            <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" th:field="*{usuario.dataNascimento}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="sexo" class="form-label">Sexo:</label>
            <select th:field="*{usuario.sexo}" class="form-select">
                <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo:</label>
            <select th:field="*{usuario.tipo}" id="tipo" class="form-select">
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label id="labelDocumento" class="form-label">CPF:</label>
            <input type="text" id="documento" th:field="*{usuario.documento}" class="form-control" required />
        </div>

       <div class="mb-3">
    <label for="roles" class="form-label">Roles:</label>
    <select th:field="*{usuario.roles}" id="roles" class="form-select">
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
    </select>
   </div>


       <!-- 🏡 Endereço -->
<h2>Endereço</h2>

<div class="mb-3">
    <label for="cep" class="form-label">CEP:</label>
    <input type="text" id="cep" th:field="*{endereco.cep}" class="form-control" required onblur="buscarCep()"/>
</div>

<div class="mb-3">
    <label for="logradouro" class="form-label">Logradouro:</label>
    <input type="text" id="logradouro" th:field="*{endereco.logradouro}" class="form-control" required/>
</div>

<div class="mb-3">
    <label for="complemento" class="form-label">Complemento:</label>
    <input type="text" id="complemento" th:field="*{endereco.complemento}" class="form-control"/>
</div>

<div class="mb-3">
    <label for="numeroCasa" class="form-label">Número:</label>
    <input type="text" id="numeroCasa" th:field="*{endereco.numeroCasa}" class="form-control" required/>
</div>

<div class="mb-3">
    <label for="bairro" class="form-label">Bairro:</label>
    <input type="text" id="bairro" th:field="*{endereco.bairro}" class="form-control" required/>
</div>

<div class="mb-3">
    <label for="localidade" class="form-label">Cidade:</label>
    <input type="text" id="localidade" th:field="*{endereco.localidade}" class="form-control" required/>
</div>

<div class="mb-3">
    <label for="uf" class="form-label">Estado:</label>
    <input type="text" id="uf" th:field="*{endereco.uf}" class="form-control" required/>
</div>
       

        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </form>
</body>
</html>
