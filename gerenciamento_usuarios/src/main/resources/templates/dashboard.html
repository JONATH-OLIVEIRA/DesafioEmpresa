<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Bootstrap + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Nossos CSS -->
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/user-profile.css}">
    <link rel="stylesheet" th:href="@{/css/pages/dashboard.css}">
</head>
<body class="dashboard-page">
    <div class="card dashboard-card" th:if="${usuario}">
        <a href="/logout" class="btn btn-outline-secondary logout-btn">
            <i class="bi bi-box-arrow-right"></i> Sair
        </a>

        <div class="text-center">
            <div th:if="${usuario.foto}" class="user-photo-container">
                <img th:src="@{${usuario.foto} + '?v=' + ${#temporals.format(now, 'yyyyMMddHHmmss')}}" alt="Foto 3x4">
            </div>
            <h5 th:text="${usuario.nome} ?: 'Usuário'"></h5>
            <p class="text-muted mb-3" th:text="${usuario.email}"></p>       
        </div>

        <div class="d-grid gap-3">
            <a href="/usuarios/listar" class="btn btn-primary btn-dashboard">
                <i class="bi bi-people"></i> Gerenciar Usuários
            </a>
            <div class="row g-2">
                <div class="col-6">
                    <a th:href="@{/usuarios/detalhes/editar/{id}(id=${usuario.id})}" class="btn btn-warning btn-dashboard">
                        <i class="bi bi-pencil"></i> Editar Perfil
                    </a>
                </div>
                <div class="col-6">
                    <a th:href="@{/usuarios/detalhes/{id}(id=${usuario.id})}" class="btn btn-info btn-dashboard">
                        <i class="bi bi-file-text"></i> Detalhes
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:unless="${usuario}" class="alert alert-danger mt-4">
        Nenhum usuário autenticado encontrado.
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
