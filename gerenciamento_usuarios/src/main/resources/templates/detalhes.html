<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <!-- Bootstrap + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Nossos CSS -->
    <link rel="stylesheet" th:href="@{/css/base/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/pages/profile.css}">
</head>
<body class="profile-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                <div class="card welcome-card">
                    <!-- Cabeçalho com foto -->
                    <div class="card-header bg-primary text-white py-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="mb-0">
                                <i class="bi bi-person-badge me-2"></i>Meu Perfil
                            </h2>
                            <a th:href="@{/usuarios/dashboard}" class="btn btn-sm btn-light">
                                <i class="bi bi-arrow-left"></i> Voltar
                            </a>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <!-- Seção de Foto e Dados Básicos -->
                        <div class="row align-items-center mb-4">
                            <div class="col-md-3 text-center">
                                <div th:if="${usuario.foto}" class="user-photo-container mb-3">
                                    <img th:src="@{${usuario.foto}}" class="img-fluid rounded" alt="Foto do usuário">
                                </div>
                                <div th:unless="${usuario.foto}" class="user-photo-placeholder mb-3">
                                    <i class="bi bi-person-circle display-4 text-muted"></i>
                                </div>
                                <a th:href="@{/usuarios/detalhes/editar/{id}(id=${usuario.id})}" 
                                   class="btn btn-primary btn-sm w-100">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                            </div>
                            
                            <div class="col-md-9">
                                <h3 th:text="${usuario.nome}" class="mb-2"></h3>
                                <p class="text-muted mb-1">
                                    <i class="bi bi-envelope"></i> <span th:text="${usuario.email}"></span>
                                </p>
                                <p class="text-muted mb-1">
                                    <i class="bi bi-person-vcard"></i> 
                                    <span th:text="${usuario.documento}"></span>
                                    <span class="badge bg-secondary ms-2" 
                                          th:text="${usuario.tipo.name() == 'FISICA' ? 'CPF' : 'CNPJ'}"></span>
                                </p>
                                <p class="text-muted">
                                    <i class="bi bi-calendar"></i> 
                                    <span th:text="${#temporals.format(usuario.dataNascimento, 'dd/MM/yyyy')}"></span>
                                    | <span th:text="${usuario.sexo}"></span>
                                </p>
                            </div>
                        </div>

                        <!-- Abas de Navegação -->
                        <ul class="nav nav-tabs mb-4">
                            <li class="nav-item">
                                <a class="nav-link active" data-bs-toggle="tab" href="#dados">Dados Pessoais</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#endereco">Endereço</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" data-bs-toggle="tab" href="#permissoes">Permissões</a>
                            </li>
                        </ul>

                        <!-- Conteúdo das Abas -->
                        <div class="tab-content">
                            <!-- Dados Pessoais -->
                            <div class="tab-pane fade show active" id="dados">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Username:</label>
                                        <p th:text="${usuario.nomeUsuario}" class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Tipo:</label>
                                        <p th:text="${usuario.tipo.name() == 'FISICA' ? 'Pessoa Física' : 'Pessoa Jurídica'}" 
                                           class="form-control-plaintext"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Endereço -->
                            <div class="tab-pane fade" id="endereco">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">CEP:</label>
                                        <p th:text="${usuario.endereco.cep}" class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label fw-bold">Logradouro:</label>
                                        <p th:text="${usuario.endereco.logradouro}" class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label fw-bold">Número:</label>
                                        <p th:text="${usuario.endereco.numeroCasa}" class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label fw-bold">Complemento:</label>
                                        <p th:text="${usuario.endereco.complemento ?: 'Não informado'}" 
                                           class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-5 mb-3">
                                        <label class="form-label fw-bold">Bairro:</label>
                                        <p th:text="${usuario.endereco.bairro}" class="form-control-plaintext"></p>
                                    </div>
                                    <div class="col-md-5 mb-3">
                                        <label class="form-label fw-bold">Cidade/UF:</label>
                                        <p th:text="${usuario.endereco.localidade} + '/' + ${usuario.endereco.uf}" 
                                           class="form-control-plaintext"></p>
                                    </div>
                                </div>
                            </div>

                            <!-- Permissões -->
                            <div class="tab-pane fade" id="permissoes" th:if="${usuario.roles}">
                                <div class="d-flex flex-wrap gap-2">
                                    <span th:each="role : ${usuario.roles}" 
                                          class="badge bg-primary py-2 px-3">
                                        <i class="bi bi-shield-lock me-1"></i>
                                        <span th:text="${role}"></span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
