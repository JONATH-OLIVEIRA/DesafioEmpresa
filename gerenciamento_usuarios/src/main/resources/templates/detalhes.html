<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perfil do Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-bg: #f8f9fa;
        }
        
        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .profile-card {
            max-width: 800px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 30px auto;
        }
        
        .profile-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .profile-photo {
            width: 120px;
            height: 160px; /* Proporção 3x4 */
            object-fit: cover;
            border: 4px solid white;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .profile-name {
            font-size: 1.8rem;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .profile-title {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
            margin: 25px 0 15px;
            font-size: 1.3rem;
        }
        
        .info-label {
            font-weight: 600;
            color: var(--primary-color);
            min-width: 120px;
            display: inline-block;
        }
        
        .document-badge {
            background-color: var(--secondary-color);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- Cabeçalho com foto -->
        <div class="profile-header">
            <div th:if="${usuario.foto}">
                <img th:src="@{${usuario.foto}}" class="profile-photo" alt="Foto do usuário">
            </div>
            <div th:unless="${usuario.foto}" class="profile-photo bg-white d-flex align-items-center justify-content-center">
                <i class="fas fa-user fa-3x text-muted"></i>
            </div>
            
            <h1 class="profile-name" th:text="${usuario.nome}"></h1>
           <div class="profile-title"
     th:text="${#strings.equalsIgnoreCase(#strings.trim(usuario.tipo), 'FISICA') ? 'Pessoa Física' : 'Pessoa Jurídica'}">
</div>
        </div>
        
        <!-- Corpo do currículo -->
        <div class="p-4 bg-white">
            <!-- Seção: Dados Pessoais -->
            <div>
                <h3 class="section-title">
                    <i class="fas fa-id-card me-2"></i>Dados Pessoais
                </h3>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <span class="info-label">Username:</span>
                        <span th:text="${usuario.nomeUsuario}"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <span class="info-label">Email:</span>
                        <span th:text="${usuario.email}"></span>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <span class="info-label">Data Nascimento:</span>
                        <span th:text="${#temporals.format(usuario.dataNascimento, 'dd/MM/yyyy')}"></span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <span class="info-label">Sexo:</span>
                        <span th:text="${usuario.sexo}"></span>
                    </div>
                </div>
                
               <div class="mb-3">
    <span class="info-label">Documento:</span>
    <span th:text="${usuario.documento}"></span>
    <!-- Garantir que lê do objeto Usuario, não do DTO -->
    <span class="document-badge" 
          th:text="${usuario.tipo.name() == 'FISICA' ? 'CPF' : 'CNPJ'}"></span>
</div>
                
            </div>
            
            <!-- Seção: Endereço -->
            <div>
                <h3 class="section-title">
                    <i class="fas fa-map-marker-alt me-2"></i>Endereço
                </h3>
                
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <span class="info-label">CEP:</span>
                        <span th:text="${usuario.endereco.cep}"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <span class="info-label">Logradouro:</span>
                        <span th:text="${usuario.endereco.logradouro}"></span>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <span class="info-label">Número:</span>
                        <span th:text="${usuario.endereco.numeroCasa}"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <span class="info-label">Complemento:</span>
                        <span th:text="${usuario.endereco.complemento ?: 'Não informado'}"></span>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <span class="info-label">Bairro:</span>
                        <span th:text="${usuario.endereco.bairro}"></span>
                    </div>
                    <div class="col-md-6 mb-2">
                        <span class="info-label">Cidade/UF:</span>
                        <span th:text="${usuario.endereco.localidade} + '/' + ${usuario.endereco.uf}"></span>
                    </div>
                </div>
            </div>
            
            <!-- Seção: Permissões -->
            <div th:if="${usuario.roles}">
                <h3 class="section-title">
                    <i class="fas fa-user-shield me-2"></i>Permissões
                </h3>
                <div th:each="role : ${usuario.roles}">
                    <span class="badge bg-secondary me-1" th:text="${role}"></span>
                </div>
            </div>
        </div>
        
        <!-- Rodapé com ações -->
        <div class="p-3 bg-light text-center">
            <a th:href="@{/usuarios/dashboard}" class="btn btn-outline-secondary me-2">
                <i class="fas fa-arrow-left me-1"></i> Voltar
            </a>
           <a th:href="@{/usuarios/detalhes/editar/{id}(id=${usuario.id})}" class="btn btn-primary">
                <i class="fas fa-edit me-1"></i> Editar Perfil
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
