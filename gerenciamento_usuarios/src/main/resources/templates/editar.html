<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edição de Usuário</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .img-thumbnail {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            background-color: #f8f9fa;
        }
        .img-thumbnail:hover {
            box-shadow: 0 0 2px 1px rgba(0, 140, 186, 0.5);
        }
        #preview {
            max-width: 200px;
            max-height: 200px;
            display: block;
            margin-bottom: 10px;
        }
    </style>

    <script>
        // Função para calcular a idade
        function validarIdade() {
            const dataNascimento = document.getElementById("dataNascimento").value;
            const nascimento = new Date(dataNascimento);
            const hoje = new Date();
            let idade = hoje.getFullYear() - nascimento.getFullYear();
            const m = hoje.getMonth() - nascimento.getMonth();
            if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) {
                idade--;
            }

            if (idade < 18) {
                alert("Você precisa ter pelo menos 18 anos para se cadastrar.");
                document.getElementById("dataNascimento").setCustomValidity("Idade inválida");
                return false;
            }
            document.getElementById("dataNascimento").setCustomValidity("");
            return true;
        }

        // Função para preview da imagem
        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('preview').style.display = 'block';
                    document.getElementById('preview').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // Função para buscar dados do CEP
        function buscarCep() {
            let cep = document.getElementById("cep").value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById("logradouro").value = data.logradouro;
                            document.getElementById("bairro").value = data.bairro;
                            document.getElementById("localidade").value = data.localidade;
                            document.getElementById("uf").value = data.uf;
                        } else {
                            alert("CEP não encontrado!");
                        }
                    })
                    .catch(error => console.error("Erro ao buscar CEP:", error));
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            let form = document.querySelector("form");
            form.addEventListener("submit", function(event) {
                if (!form.checkValidity() || !validarIdade()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add("was-validated");
            }, false);
        });

        document.addEventListener("DOMContentLoaded", function() {
            let tipoSelect = document.getElementById("tipo");
            let documentoInput = document.getElementById("documento");
            let labelDocumento = document.getElementById("labelDocumento");

            tipoSelect.addEventListener("change", function () {
                if (tipoSelect.value === "FISICA") {
                    labelDocumento.innerText = "CPF:";
                    documentoInput.placeholder = "999.999.999-99";
                } else {
                    labelDocumento.innerText = "CNPJ:";
                    documentoInput.placeholder = "99.999.999/9999-99";
                }
            });
        });
    </script>

</head>
<body class="container mt-4">
    <h1 class="text-center">Edição de Usuário</h1>

    <form th:action="@{/usuarios/detalhes/editar/{id}(id=${usuarioComEnderecoDTO.usuario.id})}"
          th:object="${usuarioComEnderecoDTO}" method="post" class="needs-validation" novalidate enctype="multipart/form-data">

        <!-- 🔹 Nome com validação Bootstrap -->
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" th:field="*{usuario.nome}" class="form-control" id="nome" required pattern=".{3,}"
                   title="O nome deve ter pelo menos 3 caracteres.">
            <div class="invalid-feedback">O nome deve ter pelo menos 3 caracteres.</div>
        </div>

        <!-- 🔹 Username -->
        <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" th:field="*{usuario.nomeUsuario}" class="form-control" id="username" required>
            <div class="invalid-feedback">O campo Username é obrigatório.</div>
        </div>

        <!-- 🔹 Foto -->
        <div class="mb-3">
            <label for="foto" class="form-label">Foto:</label>
            <div th:if="${usuarioComEnderecoDTO.usuario.foto != null and !usuarioComEnderecoDTO.usuario.foto.isEmpty()}">
                <img th:src="@{'/uploads/' + ${usuarioComEnderecoDTO.usuario.foto}}" alt="Foto atual do usuário"
                     class="img-thumbnail mb-2" id="currentPhoto">
            </div>
            <img id="preview" class="img-thumbnail" style="display: none;">
            <input type="file" accept="image/*" name="file" class="form-control" id="foto" onchange="previewImage(this)">
            <input type="hidden" th:value="${usuarioComEnderecoDTO.usuario.foto}" name="fotoAtual">
            <small class="form-text text-muted">Tamanho máximo: 2MB. Formatos: JPG, PNG.</small>
        </div>

        <!-- 🔹 Email -->
        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" th:field="*{usuario.email}" class="form-control" required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"
                   title="O e-mail deve estar em um formato válido (ex: usuario@empresa.com)">
            <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <!-- 🔹 Senha -->
        <div class="mb-3">
            <label for="senha" class="form-label">Senha:</label>
            <input type="password" th:field="*{usuario.senha}" class="form-control"
                   pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$"
                   title="A senha deve conter pelo menos 8 caracteres, uma letra maiúscula, uma letra minúscula e um número.">
            <div class="invalid-feedback">Senha inválida.</div>
        </div>

        <!-- 🔹 Data de Nascimento -->
        <div class="mb-3">
            <label for="dataNascimento" class="form-label">Data de Nascimento:</label>
            <input type="date" th:value="${#temporals.format(usuarioComEnderecoDTO.usuario.dataNascimento, 'yyyy-MM-dd')}"
                   name="usuario.dataNascimento" class="form-control" id="dataNascimento" required onchange="validarIdade()">
            <div class="invalid-feedback">Você deve ser maior de 18 anos.</div>
        </div>

        <!-- 🔹 Sexo -->
        <div class="mb-3">
            <label for="sexo" class="form-label">Sexo:</label>
            <select th:field="*{usuario.sexo}" class="form-select">
                <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <!-- 🔹 Tipo -->
        <div class="mb-3">
            <label for="tipo" class="form-label">Tipo:</label>
            <select th:field="*{usuario.tipo}" id="tipo" class="form-select">
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>

        <!-- 🔹 Documento -->
        <div class="mb-3">
            <label id="labelDocumento" class="form-label">CPF:</label>
            <input type="text" id="documento" th:field="*{usuario.documento}" class="form-control" required />
        </div>
        
        <!-- 🔹 Perfil -->
     <div class="mb-3">
    <label for="role" class="form-label">Perfil:</label>
    <select th:field="*{usuario.roles}" class="form-select" id="role">
        <option value="">Selecione o perfil</option>
        <option th:each="role : ${roles}" th:value="${role}" th:text="${role}"></option>
    </select>
    </div>

        <!-- 🏡 Endereço -->
        <h2>Endereço</h2>

        <!-- 🔹 CEP -->
        <div class="mb-3">
            <label for="cep" class="form-label">CEP:</label>
            <input type="text" id="cep" th:field="*{endereco.cep}" class="form-control" required onblur="buscarCep()"/>
        </div>

        <!-- 🔹 Logradouro -->
        <div class="mb-3">
            <label for="logradouro" class="form-label">Logradouro:</label>
            <input type="text" id="logradouro" th:field="*{endereco.logradouro}" class="form-control" required/>
        </div>

        <!-- 🔹 Complemento -->
        <div class="mb-3">
            <label for="complemento" class="form-label">Complemento:</label>
            <input type="text" id="complemento" th:field="*{endereco.complemento}" class="form-control"/>
        </div>

        <!-- 🔹 Número -->
        <div class="mb-3">
            <label for="numeroCasa" class="form-label">Número:</label>
            <input type="text" id="numeroCasa" th:field="*{endereco.numeroCasa}" class="form-control" required/>
        </div>

        <!-- 🔹 Bairro -->
        <div class="mb-3">
            <label for="bairro" class="form-label">Bairro:</label>
            <input type="text" id="bairro" th:field="*{endereco.bairro}" class="form-control" required/>
        </div>

        <!-- 🔹 Cidade -->
        <div class="mb-3">
            <label for="localidade" class="form-label">Cidade:</label>
            <input type="text" id="localidade" th:field="*{endereco.localidade}" class="form-control" required/>
        </div>

        <!-- 🔹 Estado -->
        <div class="mb-3">
            <label for="uf" class="form-label">Estado:</label>
            <input type="text" id="uf" th:field="*{endereco.uf}" class="form-control" required/>
        </div>

        <!-- 🔹 Botão de Enviar -->
        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    </form>
</body>
</html>
