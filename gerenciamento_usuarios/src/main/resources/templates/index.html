<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bem-vindo ao Sistema</title>
    
    <!-- Bootstrap CSS + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Nossos arquivos CSS organizados -->
    <link rel="stylesheet" th:href="@{/css/base/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/pages/index.css}">
</head>
<body class="welcome-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card welcome-card">
                    <div class="card-header bg-primary text-white py-4">
                        <h1 class="display-5 fw-bold mb-0">
                            <i class="bi bi-people-fill me-2"></i>Bem-vindo!
                        </h1>
                    </div>
                    <div class="card-body p-5">
                        <p class="lead text-muted mb-4">Escolha uma opção:</p>
                        
                        <!-- Botão Login (Bootstrap puro) -->
                        <a th:href="@{/login}" class="btn btn-primary btn-lg rounded-pill w-100 py-3 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Fazer Login
                        </a>
                        
                        <!-- Botão Cadastro (Bootstrap puro) -->
                        <a th:href="@{/usuarios/cadastro}" class="btn btn-outline-primary btn-lg rounded-pill w-100 py-3">
                            <i class="bi bi-person-plus-fill me-2"></i>Cadastre-se
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
