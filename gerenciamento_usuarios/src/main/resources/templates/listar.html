<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #007bff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .pagination-container {
            margin-top: 20px;
        }
        .page-size-selector {
            width: 120px;
            display: inline-block;
            margin-left: 15px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Mensagens de sucesso/erro -->
        <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${sucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="h5 mb-0">Lista de Usuários</h2>
                    <a th:href="@{/usuarios/cadastro}" class="btn btn-light btn-sm">
                        <i class="bi bi-plus-lg"></i> Novo Usuário
                    </a>
                </div>
            </div>

            <div class="card-body">
                <!-- Barra de busca e seletor de tamanho -->
                <div class="row mb-4">
                    <div class="col-md-8 mx-auto">
                        <div class="d-flex align-items-center">
                            <div class="input-group flex-grow-1">
                                <input type="text" id="buscaInput" class="form-control" 
                                       placeholder="Buscar por nome..." aria-label="Buscar">
                                <button id="buscaBtn" class="btn btn-primary" type="button">
                                    <i class="bi bi-search"></i>
                                </button>
                                <span id="loadingSpinner" class="input-group-text" style="display: none;">
                                    <span class="loading-spinner"></span>
                                </span>
                            </div>
                            
                            <select class="form-select page-size-selector" id="pageSizeSelect">
                                <option value="10">10 itens</option>
                                <option value="20" selected>20 itens</option>
                                <option value="50">50 itens</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Tabela de usuários -->
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Nome</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosTableBody">
                            <tr th:each="usuario : ${usuarios?.content}">
                                <td th:text="${usuario.nome}"></td>
                                <td th:text="${usuario.nomeUsuario}"></td>
                                <td th:text="${usuario.email}"></td>
                                <td class="text-center">
                                    <a th:href="@{/usuarios/detalhes/editar/{id}(id=${usuario.id})}" 
                                       class="btn btn-sm btn-outline-primary">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/usuarios/deletar/{id}(id=${usuario.id})}" 
                                          method="post" style="display: inline-block;">
                                        <input type="hidden" name="_method" value="delete"/>
                                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('Tem certeza que deseja deletar este usuário?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${usuarios?.content?.empty}">
                                <td colspan="4" class="text-center text-muted">
                                    Nenhum usuário encontrado
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paginação -->
                <div th:if="${usuarios?.totalPages > 1}" class="pagination-container">
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${usuarios.first} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/usuarios/listar(page=0, size=${usuarios.size})}">
                                    <i class="bi bi-chevron-double-left"></i>
                                </a>
                            </li>
                            <li class="page-item" th:classappend="${usuarios.first} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/usuarios/listar(page=${usuarios.number-1}, size=${usuarios.size})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, usuarios.totalPages)}"
                                th:classappend="${i-1 == usuarios.number} ? 'active' : ''">
                                <a class="page-link" th:href="@{/usuarios/listar(page=${i-1}, size=${usuarios.size})}"
                                   th:text="${i}"></a>
                            </li>
                            
                            <li class="page-item" th:classappend="${usuarios.last} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/usuarios/listar(page=${usuarios.number+1}, size=${usuarios.size})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                            <li class="page-item" th:classappend="${usuarios.last} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/usuarios/listar(page=${usuarios.totalPages-1}, size=${usuarios.size})}">
                                    <i class="bi bi-chevron-double-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <div class="card-footer text-end">
                <a th:href="@{/usuarios/dashboard}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja deletar este usuário? Esta ação não pode ser desfeita.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Deletar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    const buscaInput = document.getElementById('buscaInput');
    const buscaBtn = document.getElementById('buscaBtn');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const confirmDeleteModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
    const confirmDeleteBtn = document.getElementById('confirmDeleteButton');
    let timeoutId;
    let ultimaBuscaVazia = false;
    let formToDelete;

    // Configura o tamanho da página selecionado
    pageSizeSelect.value = getCurrentPageSize();
    
    // Atualiza o tamanho da página quando mudar a seleção
    pageSizeSelect.addEventListener('change', function() {
        const size = this.value;
        window.location.href = `/usuarios/listar?size=${size}&page=0`;
    });

    // Configura os listeners para os botões de delete
    document.querySelectorAll('.delete-form').forEach(form => {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            formToDelete = this;
            confirmDeleteModal.show();
        });
    });
    
    confirmDeleteBtn.addEventListener('click', function() {
        if (formToDelete) {
            formToDelete.submit();
        }
        confirmDeleteModal.hide();
    });

    function handleBusca() {
        const termo = buscaInput.value.trim();
        loadingSpinner.style.display = 'block';
        
        if (termo === '') {
            // Se o campo foi limpo, volta para a página inicial (sem busca)
            window.location.href = `/usuarios/listar?size=${getCurrentPageSize()}&page=0`;
            return;
        }
        
        // Faz a pesquisa
        fetch(`/usuarios/buscar?nome=${encodeURIComponent(termo)}&size=${getCurrentPageSize()}&page=0`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Falha na busca');
                }
                return response.json();
            })
            .then(data => {
                ultimaBuscaVazia = data.content.length === 0;
                updateTable(data.content);
                loadingSpinner.style.display = 'none';
            })
            .catch(error => {
                console.error('Erro na busca:', error);
                loadingSpinner.style.display = 'none';
                // Atualiza a tabela com uma mensagem de erro
                updateTable([]);
            });
    }

    function updateTable(usuarios) {
        const tbody = document.getElementById('usuariosTableBody');
        if (!usuarios || usuarios.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        Nenhum usuário encontrado
                    </td>
                </tr>`;
            return;
        }

        tbody.innerHTML = usuarios.map(usuario => `
            <tr>
                <td>${usuario.nome}</td>
                <td>${usuario.nomeUsuario}</td>
                <td>${usuario.email}</td>
                <td class="text-center">
                    <a href="/usuarios/detalhes/editar/${usuario.id}" 
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form action="/usuarios/deletar/${usuario.id}" 
                          method="post" class="delete-form" style="display: inline-block;">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
        `).join('');

        // Reconfigura os listeners para os novos botões de delete
        document.querySelectorAll('.delete-form').forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                formToDelete = this;
                confirmDeleteModal.show();
            });
        });
    }

    function getCurrentPageSize() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('size') || 20; 
    }

    // Event listeners
    buscaInput.addEventListener('input', function() {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(handleBusca, 500);
    });

    buscaBtn.addEventListener('click', handleBusca);
});
</script>
</body>
</html>
