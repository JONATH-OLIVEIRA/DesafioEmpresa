<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Sistema</title>
    
    <!-- Bootstrap + Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Nossos CSS (MESMA ESTRUTURA do index) -->
    <link rel="stylesheet" th:href="@{/css/base/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/pages/auth.css}">
</head>
<body class="auth-page">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card welcome-card">
                    <div class="card-header bg-primary text-white py-4">
                        <h2 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Login</h2>
                    </div>
                    <div class="card-body p-5">
                        <form th:action="@{/login}" method="post">
                            <!-- Input Email -->
                            <div class="mb-4">
                                <label for="username" class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="username" name="username" required autofocus>
                                </div>
                            </div>
                            
                            <!-- Input Senha -->
                            <div class="mb-4">
                                <label for="password" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                            </div>

                            <!-- Mensagem de Erro -->
                            <div th:if="${param.error}" class="alert alert-danger mb-4">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>Credenciais inválidas
                            </div>

                            <!-- Botão Entrar (MESMO ESTILO do index) -->
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 py-3 mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                            </button>
                        </form>

                        <!-- Link Cadastro (MESMO ESTILO do index) -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted mb-3">Ainda não tem uma conta?</p>
                            <a th:href="@{/usuarios/cadastro}" class="btn btn-outline-primary btn-lg rounded-pill w-100 py-3">
                                <i class="bi bi-person-plus-fill me-2"></i>Criar Conta
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
