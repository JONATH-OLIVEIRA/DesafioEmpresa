<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Cadastro de Usuário</title>
    </h:head>
    <h:body>
     <h:body>
        <h1>Bem-vindo ao Cadastro de Usuários!</h1>
       
    </h:body>
        <h:form>
            <p:panel header="Cadastro de Usuário">
                <p:inputText value="#{usuarioBean.nome}" label="Nome" />
                <p:inputText value="#{usuarioBean.email}" label="Email" />
                <p:inputMask value="#{usuarioBean.documento}" mask="#{usuarioBean.tipo eq 'FISICA' ? '999.999.999-99' : '99.999.999/9999-99'}" />
                <p:commandButton value="Salvar" action="#{usuarioBean.salvar()}" />
            </p:panel>
        </h:form>
    </h:body>
</html>
