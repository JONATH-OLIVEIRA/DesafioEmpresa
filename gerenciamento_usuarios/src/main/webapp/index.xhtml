<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<head>
    <title>Teste JSF + PrimeFaces</title>
</head>

<body>
	<h1> SO RECONHECO TEXTO </h1>
    <h:form>
        <p:growl id="growl" showDetail="true"/>
        
        <p:panel header="Bem-vindo ao JSF 4.0 + PrimeFaces 12!">
            <p:outputLabel value="Digite seu nome:"/>
            <p:inputText id="nome" value="#{beanUsuario.nome}" required="true"/>
            <p:commandButton value="Enviar" update="growl"
                             action="#{beanUsuario.mostrarMensagem}"/>
        </p:panel>
    </h:form>
</body>
</html>
